<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-paper: #f7f5f0;
      --bg-card: #ffffff;
      --ink-main: #1c1b18;
      --ink-muted: #656056;
      --line-hair: #ded8cc;
      --accent-earth: #9e5438;
      --accent-earth-soft: #f3eae5;
    }
    body {
      font-family: 'Inter', 'Noto Sans KR', sans-serif;
      background-color: var(--bg-paper);
      color: var(--ink-main);
      background-image:
        linear-gradient(to right, rgba(28, 27, 24, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(28, 27, 24, 0.04) 1px, transparent 1px);
      background-size: 40px 40px;
    }
    .hairline-border {
      border: 1px solid var(--line-hair);
    }
    .tab-active {
      background-color: var(--ink-main);
      color: #ffffff;
    }
    .modal-backdrop {
      background-color: rgba(28, 27, 24, 0.45);
      backdrop-filter: blur(2px);
    }
  </style>
</head>
<body class="min-h-screen antialiased selection:bg-[#9e5438]/20">
  <div class="max-w-5xl mx-auto px-4 sm:px-6 py-6 sm:py-10">
    <!-- Header -->
    <header class="hairline-border bg-white/90 rounded-2xl p-5 sm:p-7 mb-6 shadow-sm">
      <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
        <div class="flex items-stretch gap-4">
          <div class="w-0.5 bg-[#9e5438] rounded-full shrink-0"></div>
          <div>
            <p class="text-xs font-semibold tracking-widest uppercase text-[#9e5438]">ArchBirthday Archive</p>
            <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-[#1c1b18] mt-0.5">
              건축 생년월일 아카이브
            </h1>
            <p class="text-sm text-[#656056] mt-1">
              생년월일을 입력하면 같은 날 완공·개관한 현존 건축물과 건축가를 찾아줍니다.
            </p>
          </div>
        </div>
        <nav class="flex flex-wrap gap-2" aria-label="메인 탭">
          <button type="button" data-tab="matcher" class="nav-tab tab-active px-3.5 py-2 rounded-lg text-sm font-medium transition cursor-pointer">
            생년월일 매칭
          </button>
          <button type="button" data-tab="archive" class="nav-tab bg-[#f0ede6] text-[#1c1b18] hover:bg-[#e5e0d5] px-3.5 py-2 rounded-lg text-sm font-medium transition cursor-pointer">
            전체 아카이브 <span id="archiveCountBadge" class="ml-1 text-xs opacity-75">18</span>
          </button>
          <button type="button" data-tab="saved" class="nav-tab bg-[#f0ede6] text-[#1c1b18] hover:bg-[#e5e0d5] px-3.5 py-2 rounded-lg text-sm font-medium transition cursor-pointer">
            저장한 목록 <span id="savedCountBadge" class="ml-1 text-xs opacity-75">0</span>
          </button>
        </nav>
      </div>
    </header>

    <!-- Tab 1: Matcher -->
    <main id="view-matcher" class="space-y-6">
      <!-- Search Panel -->
      <section class="hairline-border bg-white rounded-2xl p-5 sm:p-6 shadow-sm">
        <form id="birthForm" class="space-y-4">
          <div class="grid grid-cols-1 md:grid-cols-12 gap-3 items-end">
            <div class="md:col-span-9">
              <label for="birthDateInput" class="block text-xs font-semibold text-[#656056] uppercase tracking-wider mb-1.5">
                생년월일 (YYYY-MM-DD)
              </label>
              <input
                id="birthDateInput"
                type="date"
                value="2014-03-21"
                min="1800-01-01"
                max="2026-12-31"
                required
                class="w-full h-11 px-3.5 rounded-xl hairline-border bg-[#faf9f6] text-[#1c1b18] font-medium focus:outline-none focus:ring-2 focus:ring-[#9e5438]"
              />
            </div>
            <div class="md:col-span-3 flex gap-2">
              <button
                type="submit"
                id="searchBtn"
                class="flex-1 h-11 px-4 rounded-xl bg-[#1c1b18] hover:bg-[#33312b] text-white text-sm font-semibold transition cursor-pointer"
              >
                건축물 찾기
              </button>
              <button
                type="button"
                id="randomDateBtn"
                title="무작위 날짜 선택"
                class="h-11 px-3.5 rounded-xl hairline-border bg-[#faf9f6] hover:bg-[#efece4] text-sm font-medium text-[#1c1b18] transition cursor-pointer"
              >
                랜덤
              </button>
            </div>
          </div>

          <div id="searchHistoryBar" class="flex flex-wrap items-center gap-2 pt-1"></div>
        </form>
      </section>

      <!-- Status Banner -->
      <div id="statusBanner" class="hidden rounded-xl px-4 py-3 text-sm hairline-border bg-white/90 flex items-center justify-between gap-3">
        <span id="statusText" class="text-[#1c1b18]"></span>
        <span id="statusBadge" class="text-xs font-semibold px-2.5 py-0.5 rounded-full bg-[#f0ede6] text-[#656056] shrink-0"></span>
      </div>

      <!-- Results Area -->
      <section id="resultsSection" class="space-y-6"></section>
    </main>

    <!-- Tab 2: Full Archive -->
    <section id="view-archive" class="hidden space-y-5">
      <div class="hairline-border bg-white rounded-2xl p-5 shadow-sm flex flex-col sm:flex-row gap-3 sm:items-center sm:justify-between">
        <div class="flex-1">
          <input
            id="archiveSearchInput"
            type="search"
            placeholder="건축물 이름, 건축가, 도시, 프로그램(미술관, 도서관 등) 검색..."
            class="w-full h-10 px-3.5 rounded-xl hairline-border bg-[#faf9f6] text-sm focus:outline-none focus:ring-2 focus:ring-[#9e5438]"
          />
        </div>
        <div class="flex gap-2">
          <button type="button" data-region="all" class="region-btn tab-active px-3 py-2 rounded-lg text-xs font-semibold transition cursor-pointer">전체</button>
          <button type="button" data-region="korea" class="region-btn bg-[#f0ede6] text-[#1c1b18] px-3 py-2 rounded-lg text-xs font-semibold transition cursor-pointer">한국</button>
          <button type="button" data-region="global" class="region-btn bg-[#f0ede6] text-[#1c1b18] px-3 py-2 rounded-lg text-xs font-semibold transition cursor-pointer">해외</button>
        </div>
      </div>
      <div id="archiveGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </section>

    <!-- Tab 3: Saved -->
    <section id="view-saved" class="hidden space-y-4">
      <div class="hairline-border bg-white rounded-2xl p-5 shadow-sm flex items-center justify-between">
        <div>
          <h2 class="text-base font-bold">저장한 건축물</h2>
          <p class="text-xs text-[#656056] mt-0.5">관심 있는 건축물을 북마크해 모아볼 수 있습니다.</p>
        </div>
        <button type="button" id="clearSavedBtn" class="text-xs font-semibold px-3 py-1.5 rounded-lg hairline-border hover:bg-[#f0ede6] text-[#656056] cursor-pointer">
          모두 비우기
        </button>
      </div>
      <div id="savedGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </section>

    <!-- Data Scope Footer -->
    <footer class="mt-10 pt-5 border-t border-[#ded8cc] text-xs text-[#656056] flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2">
      <p>
        내장 아카이브(ArchDaily·공식 자료 기반 검증 건축물 37선)와 <a href="https://query.wikidata.org/" target="_blank" rel="noopener noreferrer" class="underline hover:text-[#1c1b18]">Wikidata SPARQL</a> 공개 데이터를 함께 조회합니다.
      </p>
      <p>완공일 및 개관일(YYYY-MM-DD) 기준 매칭</p>
    </footer>
  </div>

  <!-- Detail Modal -->
  <div id="detailModal" class="hidden fixed inset-0 z-50 modal-backdrop flex items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="bg-white hairline-border rounded-2xl max-w-lg w-full p-6 shadow-xl relative">
      <button type="button" id="closeModalBtn" aria-label="닫기" class="absolute top-4 right-4 w-8 h-8 rounded-full bg-[#f0ede6] hover:bg-[#e2ddd3] flex items-center justify-center text-sm font-bold cursor-pointer">
        ✕
      </button>
      <div id="modalBody"></div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="hidden fixed bottom-5 right-5 z-50 bg-[#1c1b18] text-white text-xs font-medium px-4 py-2.5 rounded-xl shadow-lg"></div>

    function loadSaved() {
      try {
        const raw = localStorage.getItem('arch_birthday_saved_v1');
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed)) state.savedIds = parsed;
        }
      } catch (e) {
        state.savedIds = [];
      }
    }

    function persistSaved() {
      try {
        localStorage.setItem('arch_birthday_saved_v1', JSON.stringify(state.savedIds));
      } catch (e) {
        // Ignore storage errors in restricted environments
      }
    }

    function loadHistory() {
      try {
        const raw = localStorage.getItem('arch_birthday_history_v1');
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed)) state.searchHistory = parsed;
        }
      } catch (e) {
        state.searchHistory = [];
      }
    }

    function persistHistory() {
      try {
        localStorage.setItem('arch_birthday_history_v1', JSON.stringify(state.searchHistory));
      } catch (e) {
        // Ignore storage errors in restricted environments
      }
    }

    function addToHistory(dateStr) {
      if (!dateStr) return;
      state.searchHistory = [dateStr, ...state.searchHistory.filter((d) => d !== dateStr)].slice(0, 8);
      persistHistory();
      renderHistory();
    }

    function renderHistory() {
      const bar = document.getElementById('searchHistoryBar');
      if (!bar) return;
      if (!state.searchHistory.length) {
        bar.innerHTML = `
          <span class="text-xs font-medium text-[#656056]">검색 기록:</span>
          <span class="text-xs text-[#8a8376]">아직 검색 기록이 없습니다.</span>
        `;
        return;
      }
      const pills = state.searchHistory.map((d) => {
        const active = d === state.selectedDate;
        const cls = active
          ? 'bg-[#f3eae5] text-[#9e5438] hover:bg-[#ead9d0]'
          : 'bg-[#f0ede6] text-[#1c1b18] hover:bg-[#e4dfd5]';
        return `<button type="button" data-history-date="${d}" class="history-btn text-xs px-2.5 py-1 rounded-full ${cls} font-medium transition cursor-pointer">${d}</button>`;
      }).join('');
      bar.innerHTML = `
        <span class="text-xs font-medium text-[#656056]">검색 기록:</span>
        ${pills}
        <button type="button" id="clearHistoryBtn" class="text-xs text-[#8a8376] hover:text-[#1c1b18] underline ml-1 cursor-pointer">전체 삭제</button>
      `;
      bar.querySelectorAll('.history-btn').forEach((btn) => {
        btn.addEventListener('click', () => runSearch(btn.dataset.historyDate));
      });
      const clearBtn = document.getElementById('clearHistoryBtn');
      if (clearBtn) {
        clearBtn.addEventListener('click', () => {
          state.searchHistory = [];
          persistHistory();
          renderHistory();
        });
      }
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.remove('hidden');
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => toast.classList.add('hidden'), 2400);
    }

    function toggleSave(item) {
      const idx = state.savedIds.findIndex((s) => s.id === item.id);
      if (idx >= 0) {
        state.savedIds.splice(idx, 1);
        showToast('저장 목록에서 제거했습니다.');
      } else {
        state.savedIds.unshift(item);
        showToast('관심 건축물에 저장했습니다.');
      }
      persistSaved();
      updateBadges();
      renderCurrentView();
    }

    function isSaved(id) {
      return state.savedIds.some((s) => s.id === id);
    }

    function updateBadges() {
      document.getElementById('archiveCountBadge').textContent = CURATED_BUILDINGS.length;
      document.getElementById('savedCountBadge').textContent = state.savedIds.length;
    }

    function matchLocal(dateStr) {
      const [y, m, d] = dateStr.split('-');
      const md = `${m}-${d}`;
      const exact = [];
      const monthDay = [];
      const year = [];

      CURATED_BUILDINGS.forEach((b) => {
        const [by, bm, bd] = b.date.split('-');
        if (b.date === dateStr) {
          exact.push(b);
        } else if (`${bm}-${bd}` === md) {
          monthDay.push(b);
        } else if (by === y) {
          year.push(b);
        }
      });

      return { exact, monthDay, year };
    }

    async function runSparql(sparql) {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 15000);
      try {
        const url = `https://query.wikidata.org/sparql?format=json&query=${encodeURIComponent(sparql)}`;
        const res = await fetch(url, {
          method: 'GET',
          mode: 'cors',
          signal: controller.signal
        });
        clearTimeout(timeoutId);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        return data?.results?.bindings || [];
      } catch (err) {
        clearTimeout(timeoutId);
        throw err;
      }
    }

    function parseBindings(bindings, fallbackDate) {
      const map = new Map();
      bindings.forEach((row) => {
        const uri = row.item?.value || '';
        const qid = uri.split('/').pop();
        if (!qid || map.has(qid)) return;
        const label = row.itemLabel?.value || qid;
        if (/^Q\d+$/.test(label)) return;
        const rawDate = row.date?.value ? row.date.value.slice(0, 10) : fallbackDate;
        map.set(qid, {
          id: `wd-${qid}`,
          nameKo: label,
          nameEn: 'Wikidata Architectural Record',
          date: rawDate,
          architect: row.architectLabel?.value || '건축가 정보 미상 (Wikidata)',
          location: row.countryLabel?.value || '위치 정보 미상',
          program: row.typeLabel?.value || '건축물',
          officialUrl: row.website?.value || '',
          address: row.streetAddress?.value || '',
          postalCode: row.postalCode?.value || '',
          region: 'global',
          note: 'Wikidata 오픈 데이터(P1619 개관일 / P571 완공일)에서 실시간 조회된 건축물입니다.',
          imageUrl: row.image?.value ? row.image.value.replace('http://', 'https://') + '?width=800' : '',
          url: row.article?.value || uri,
          fromWikidata: true
        });
      });
      return Array.from(map.values());
    }

    async function queryWikidata(dateStr) {
      if (state.wikidataCache[dateStr]) {
        return state.wikidataCache[dateStr];
      }
      const [yStr, mStr, dStr] = dateStr.split('-');
      const y = parseInt(yStr, 10);
      const m = parseInt(mStr, 10);
      const d = parseInt(dStr, 10);
      const startIso = `${yStr}-${mStr}-${dStr}T00:00:00Z`;
      const endIso = `${yStr}-${mStr}-${dStr}T23:59:59Z`;

      const exactSparql = `
        SELECT DISTINCT ?item ?itemLabel ?architectLabel ?countryLabel ?typeLabel ?date ?article ?website ?streetAddress ?postalCode ?image WHERE {
          ?item wdt:P84 ?architect .
          { ?item wdt:P1619 ?date . } UNION { ?item wdt:P571 ?date . }
          FILTER(?date >= "${startIso}"^^xsd:dateTime && ?date <= "${endIso}"^^xsd:dateTime)
          OPTIONAL { ?item wdt:P17 ?country . }
          OPTIONAL { ?item wdt:P31 ?type . }
          OPTIONAL { ?item wdt:P856 ?website . }
          OPTIONAL { ?item wdt:P6375 ?streetAddress . }
          OPTIONAL { ?item wdt:P281 ?postalCode . }
          OPTIONAL { ?item wdt:P18 ?image . }
          OPTIONAL { ?article schema:about ?item ; schema:isPartOf <https://en.wikipedia.org/> . }
          SERVICE wikibase:label { bd:serviceParam wikibase:language "ko,en" . }
        }
        LIMIT 20
      `;
      const mdSparql = `
        SELECT DISTINCT ?item ?itemLabel ?architectLabel ?countryLabel ?typeLabel ?date ?article ?image WHERE {
          ?item wdt:P84 ?architect .
          ?item wdt:P1619 ?date .
          FILTER(MONTH(?date) = ${m} && DAY(?date) = ${d} && YEAR(?date) != ${y})
          OPTIONAL { ?item wdt:P17 ?country . }
          OPTIONAL { ?item wdt:P31 ?type . }
          OPTIONAL { ?item wdt:P18 ?image . }
          OPTIONAL { ?article schema:about ?item ; schema:isPartOf <https://en.wikipedia.org/> . }
          SERVICE wikibase:label { bd:serviceParam wikibase:language "ko,en" . }
        }
        LIMIT 12
      `;

      const [exactRes, mdRes] = await Promise.allSettled([runSparql(exactSparql), runSparql(mdSparql)]);
      if (exactRes.status === 'fulfilled' || mdRes.status === 'fulfilled') {
        const items = exactRes.status === 'fulfilled' ? parseBindings(exactRes.value, dateStr) : [];
        const mdItems = mdRes.status === 'fulfilled' ? parseBindings(mdRes.value, dateStr) : [];
        state.wikidataCache[dateStr] = { status: 'ok', items, mdItems };
        return state.wikidataCache[dateStr];
      }
      const errMsg = exactRes.reason?.message || mdRes.reason?.message || '연결 오류';
      return { status: 'error', items: [], mdItems: [], error: errMsg };
    }

    const WIKI_TITLE_OVERRIDES = {
      'centre-pompidou': 'Centre_Pompidou',
      'louvre-pyramid': 'Louvre_Pyramid',
      'oslo-opera-house': 'Oslo_Opera_House',
      'pompidou-metz': 'Centre_Pompidou-Metz',
      'harpa-concert-hall': 'Harpa_(concert_hall)',
      'mmca-seoul': 'National_Museum_of_Modern_and_Contemporary_Art',
      'zeitz-mocaa': 'Zeitz_Museum_of_Contemporary_Art_Africa',
      'oodi-helsinki': 'Helsinki_Central_Library_Oodi',
      'depot-boijmans': 'Depot_Boijmans_Van_Beuningen'
    };

    function getWikiTitle(item) {
      if (WIKI_TITLE_OVERRIDES[item.id]) return WIKI_TITLE_OVERRIDES[item.id];
      if (item.url && item.url.includes('en.wikipedia.org/wiki/')) {
        return decodeURIComponent(item.url.split('en.wikipedia.org/wiki/')[1].split('#')[0]);
      }
      if (item.nameEn && item.nameEn !== 'Wikidata Architectural Record') {
        return item.nameEn;
      }
      return '';
    }

    async function resolveImageUrl(item) {
      if (!item) return '';
      if (item.imageUrl) return item.imageUrl;
      if (Object.prototype.hasOwnProperty.call(state.imageCache, item.id)) {
        return state.imageCache[item.id];
      }
      const title = getWikiTitle(item);
      if (!title) {
        state.imageCache[item.id] = '';
        return '';
      }
      try {
        const res = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title)}`);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        const src = data?.thumbnail?.source || data?.originalimage?.source || '';
        state.imageCache[item.id] = src;
        return src;
      } catch (e) {
        state.imageCache[item.id] = '';
        return '';
      }
    }

    function hydrateImages(root) {
      if (!root) return;
      root.querySelectorAll('img[data-img-id]').forEach(async (img) => {
        if (img.dataset.hydrated) return;
        img.dataset.hydrated = '1';
        const item = findItemById(img.dataset.imgId);
        if (!item) return;
        const src = await resolveImageUrl(item);
        if (src) {
          img.src = src;
        }
      });
    }

    function formatHoursHTML(hours) {
      if (!hours) return '';
      const lines = hours.split(' / ').map((line) => `<p>${line.trim()}</p>`).join('');
      return `
        <div class="flex items-start gap-1.5">
          <span class="text-[#656056] font-medium shrink-0">운영 시간:</span>
          <div class="space-y-0.5">${lines}</div>
        </div>
      `;
    }

    function createCardHTML(item, badgeLabel = '') {
      const saved = isSaved(item.id);
      const badgeHTML = badgeLabel
        ? `<span class="text-[11px] font-semibold px-2 py-0.5 rounded-full bg-[#f3eae5] text-[#9e5438]">${badgeLabel}</span>`
        : '';
      const sourceTag = item.fromWikidata
        ? `<span class="text-[11px] font-medium px-2 py-0.5 rounded-full bg-[#eef2f6] text-[#3a5570]">Wikidata</span>`
        : `<span class="text-[11px] font-medium px-2 py-0.5 rounded-full bg-[#f0ede6] text-[#656056]">아카이브</span>`;

      const cachedImg = item.imageUrl || state.imageCache[item.id] || '';
      return `
        <article class="hairline-border bg-white rounded-2xl p-5 shadow-sm hover:shadow-md transition flex flex-col justify-between gap-4">
          <div>
            <div class="relative w-full h-44 rounded-xl overflow-hidden bg-[#f0ede6] mb-3.5 hairline-border">
              <div class="absolute inset-0 flex flex-col items-center justify-center text-[#8a8376] px-4 text-center">
                <svg class="w-7 h-7 opacity-40 mb-1" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" aria-hidden="true">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 21h16.5M4.5 3h15M5.25 3v18m13.5-18v18M9 6.75h1.5m-1.5 3h1.5m-1.5 3h1.5m3-6H15m-1.5 3H15m-1.5 3H15M9 21v-3.375c0-.621.504-1.125 1.125-1.125h3.75c.621 0 1.125.504 1.125 1.125V21" />
                </svg>
                <span class="text-[11px] font-medium opacity-75 line-clamp-1">${item.nameEn || item.nameKo}</span>
              </div>
              <img
                data-img-id="${item.id}"
                alt="${item.nameKo}"
                loading="lazy"
                ${cachedImg ? `src="${cachedImg}"` : ''}
                onload="this.classList.remove('opacity-0'); this.classList.add('opacity-100');"
                onerror="this.style.display='none';"
                class="relative z-10 w-full h-full object-cover transition-opacity duration-300 ${cachedImg ? 'opacity-100' : 'opacity-0'}"
              />
            </div>
            <div class="flex items-start justify-between gap-2 mb-2.5">
              <div class="flex flex-wrap items-center gap-1.5">
                <span class="text-xs font-mono font-semibold text-[#9e5438]">${item.date}</span>
                ${badgeHTML}
                ${sourceTag}
              </div>
              <button
                type="button"
                data-save-id="${item.id}"
                class="save-toggle-btn text-xs px-2.5 py-1 rounded-lg hairline-border ${saved ? 'bg-[#1c1b18] text-white' : 'bg-[#faf9f6] text-[#656056] hover:bg-[#efece4]'} font-medium transition cursor-pointer shrink-0"
              >
                ${saved ? '★ 저장됨' : '☆ 저장'}
              </button>
            </div>
            <h3 class="text-lg font-bold text-[#1c1b18] leading-snug">${item.nameKo}</h3>
            <p class="text-xs text-[#656056] mt-0.5">${item.nameEn}</p>
            <div class="mt-3 pt-3 border-t border-[#f0ede6] space-y-1 text-sm">
              <p><span class="text-[#656056] font-medium">건축가:</span> <span class="font-semibold text-[#1c1b18]">${item.architect}</span></p>
              <div class="flex items-start gap-1.5">
                <span class="text-[#656056] font-medium shrink-0">위치:</span>
                <div class="space-y-0.5">
                  <p>${item.location}</p>
                  ${item.address ? `<p class="text-xs text-[#656056]">${item.address}${item.postalCode && !item.postalCode.startsWith('없음') && !item.address.includes(item.postalCode) ? ` (${item.postalCode})` : ''}</p>` : (item.postalCode && !item.postalCode.startsWith('없음') ? `<p class="text-xs text-[#656056]">${item.postalCode}</p>` : '')}
                </div>
              </div>
              <p><span class="text-[#656056] font-medium">프로그램:</span> ${item.program || '건축물'}</p>
              ${formatHoursHTML(item.hours)}
            </div>
          </div>
          <div class="flex items-center justify-between pt-2">
            <button
              type="button"
              data-detail-id="${item.id}"
              class="detail-open-btn text-xs font-semibold text-[#1c1b18] hover:text-[#9e5438] underline underline-offset-4 cursor-pointer"
            >
              상세 정보 보기
            </button>
            <div class="flex items-center gap-3">
              ${item.officialUrl ? `<a href="${item.officialUrl}" target="_blank" rel="noopener noreferrer" class="text-xs font-semibold text-[#9e5438] hover:underline">공식 웹사이트 ↗</a>` : ''}
              <a
                href="${item.url}"
                target="_blank"
                rel="noopener noreferrer"
                class="text-xs font-medium text-[#656056] hover:text-[#1c1b18]"
              >
                출처 ↗
              </a>
            </div>
          </div>
        </article>
      `;
    }

    function renderGroup(title, subtitle, items, badgeLabel) {
      if (!items.length) return '';
      return `
        <div class="space-y-3">
          <div class="flex items-baseline justify-between gap-2">
            <div>
              <h2 class="text-base sm:text-lg font-bold text-[#1c1b18]">${title}</h2>
              <p class="text-xs text-[#656056]">${subtitle}</p>
            </div>
            <span class="text-xs font-semibold text-[#9e5438]">${items.length}건</span>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            ${items.map((item) => createCardHTML(item, badgeLabel)).join('')}
          </div>
        </div>
      `;
    }

    function renderMatcherResults() {
      const container = document.getElementById('resultsSection');
      const { exact, monthDay, year, wikidata, wikidataMd = [], wikidataStatus } = state.lastResults;
      const [y, m, d] = state.selectedDate.split('-');

      // Merge exact local + exact wikidata (dedup by lowercase name)
      const exactCombined = [...exact];
      const seenNames = new Set(exact.map((x) => x.nameKo.toLowerCase()));
      wikidata.forEach((w) => {
        if (!seenNames.has(w.nameKo.toLowerCase())) {
          exactCombined.push(w);
        }
      });

      let html = '';

      if (exactCombined.length > 0) {
        html += renderGroup(
          `완벽 일치 (${state.selectedDate})`,
          '입력한 생년월일과 연·월·일이 모두 일치하는 건축물입니다.',
          exactCombined,
          '완벽 일치'
        );
      } else {
        html += `
          <div class="hairline-border bg-white rounded-2xl p-6 text-center space-y-2">
            <p class="text-sm font-semibold text-[#1c1b18]">
              ${state.selectedDate}에 정확히 일치하는 건축물을 찾지 못했습니다.
            </p>
            <p class="text-xs text-[#656056]">
              ${wikidataStatus === 'loading' ? 'Wikidata에서 전 세계 건축물 데이터를 실시간 조회하고 있습니다...' : '아래에서 같은 생일(월·일) 또는 같은 해에 완공된 건축물을 확인해 보세요.'}
            </p>
          </div>
        `;
      }

      const mdCombined = [...monthDay];
      const seenMd = new Set(monthDay.map((x) => x.nameKo.toLowerCase()));
      wikidataMd.forEach((w) => {
        if (!seenMd.has(w.nameKo.toLowerCase())) mdCombined.push(w);
      });

      if (mdCombined.length > 0) {
        html += renderGroup(
          `같은 생일 (${parseInt(m, 10)}월 ${parseInt(d, 10)}일)`,
          '연도는 다르지만 같은 월·일에 완공 또는 개관한 건축물입니다.',
          mdCombined,
          '월·일 일치'
        );
      }

      if (year.length > 0) {
        html += renderGroup(
          `같은 해 탄생 (${y}년)`,
          '같은 해에 완공되어 시대를 함께 시작한 건축물입니다.',
          year,
          `${y}년 완공`
        );
      }

      if (!exactCombined.length && !mdCombined.length && !year.length && wikidataStatus !== 'loading') {
        html += `
          <div class="hairline-border bg-[#faf9f6] rounded-2xl p-5 text-center">
            <p class="text-xs text-[#656056]">
              상단의 <strong>검색 기록</strong>이나 <strong>랜덤</strong> 버튼을 눌러 다른 날짜의 건축물도 탐색해 보세요.
            </p>
          </div>
        `;
      }

      container.innerHTML = html;
      attachCardListeners(container);
    }

    function renderArchive() {
      const grid = document.getElementById('archiveGrid');
      const q = state.archiveQuery.trim().toLowerCase();
      const filtered = CURATED_BUILDINGS.filter((b) => {
        const matchRegion = state.regionFilter === 'all' || b.region === state.regionFilter;
        const matchQuery =
          !q ||
          b.nameKo.toLowerCase().includes(q) ||
          b.nameEn.toLowerCase().includes(q) ||
          b.architect.toLowerCase().includes(q) ||
          b.location.toLowerCase().includes(q) ||
          (b.program && b.program.toLowerCase().includes(q)) ||
          (b.address && b.address.toLowerCase().includes(q)) ||
          (b.postalCode && b.postalCode.toLowerCase().includes(q)) ||
          b.date.includes(q);
        return matchRegion && matchQuery;
      });

      if (!filtered.length) {
        grid.innerHTML = `<div class="md:col-span-2 hairline-border bg-white rounded-2xl p-8 text-center text-sm text-[#656056]">검색 조건에 맞는 건축물이 없습니다.</div>`;
        return;
      }

      grid.innerHTML = filtered.map((b) => createCardHTML(b)).join('');
      attachCardListeners(grid);
    }

    function renderSaved() {
      const grid = document.getElementById('savedGrid');
      if (!state.savedIds.length) {
        grid.innerHTML = `<div class="md:col-span-2 hairline-border bg-white rounded-2xl p-8 text-center text-sm text-[#656056]">저장한 건축물이 아직 없습니다. 카드 우측의 '☆ 저장' 버튼을 눌러 추가해 보세요.</div>`;
        return;
      }
      grid.innerHTML = state.savedIds.map((b) => createCardHTML(b)).join('');
      attachCardListeners(grid);
    }

    function findItemById(id) {
      return (
        CURATED_BUILDINGS.find((b) => b.id === id) ||
        state.lastResults.wikidata.find((b) => b.id === id) ||
        (state.lastResults.wikidataMd || []).find((b) => b.id === id) ||
        state.savedIds.find((b) => b.id === id)
      );
    }

    function openDetailModal(item) {
      if (!item) return;
      const modal = document.getElementById('detailModal');
      const body = document.getElementById('modalBody');
      const modalImg = item.imageUrl || state.imageCache[item.id] || '';
      body.innerHTML = `
        <div class="relative w-full h-52 rounded-xl overflow-hidden bg-[#f0ede6] mb-4 hairline-border">
          <div class="absolute inset-0 flex flex-col items-center justify-center text-[#8a8376] px-4 text-center">
            <svg class="w-8 h-8 opacity-40 mb-1" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 21h16.5M4.5 3h15M5.25 3v18m13.5-18v18M9 6.75h1.5m-1.5 3h1.5m-1.5 3h1.5m3-6H15m-1.5 3H15m-1.5 3H15M9 21v-3.375c0-.621.504-1.125 1.125-1.125h3.75c.621 0 1.125.504 1.125 1.125V21" />
            </svg>
            <span class="text-xs font-medium opacity-75">${item.nameEn || item.nameKo}</span>
          </div>
          <img
            data-img-id="${item.id}"
            alt="${item.nameKo}"
            ${modalImg ? `src="${modalImg}"` : ''}
            onload="this.classList.remove('opacity-0'); this.classList.add('opacity-100');"
            onerror="this.style.display='none';"
            class="relative z-10 w-full h-full object-cover transition-opacity duration-300 ${modalImg ? 'opacity-100' : 'opacity-0'}"
          />
        </div>
        <p class="text-xs font-mono font-semibold text-[#9e5438]">${item.date}</p>
        <h3 id="modalTitle" class="text-xl font-bold text-[#1c1b18] mt-1">${item.nameKo}</h3>
        <p class="text-xs text-[#656056]">${item.nameEn}</p>
        <div class="mt-4 space-y-2 text-sm border-y border-[#f0ede6] py-3">
          <p><span class="text-[#656056] font-medium">건축가:</span> <span class="font-semibold">${item.architect}</span></p>
          <div class="flex items-start gap-1.5">
                <span class="text-[#656056] font-medium shrink-0">위치:</span>
                <div class="space-y-0.5">
                  <p>${item.location}</p>
                  ${item.address ? `<p class="text-xs text-[#656056]">${item.address}${item.postalCode && !item.postalCode.startsWith('없음') && !item.address.includes(item.postalCode) ? ` (${item.postalCode})` : ''}</p>` : (item.postalCode && !item.postalCode.startsWith('없음') ? `<p class="text-xs text-[#656056]">${item.postalCode}</p>` : '')}
                </div>
              </div>
          <p><span class="text-[#656056] font-medium">프로그램:</span> ${item.program || '건축물'}</p>
        </div>
        <p class="text-sm text-[#1c1b18] leading-relaxed mt-4">${item.note}</p>
        <div class="mt-5 flex flex-wrap justify-end gap-2">
          ${item.officialUrl ? `<a href="${item.officialUrl}" target="_blank" rel="noopener noreferrer" class="px-4 py-2 rounded-xl bg-[#9e5438] text-white text-xs font-semibold hover:bg-[#86452d] transition">공식 웹사이트 ↗</a>` : ''}
          <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="px-4 py-2 rounded-xl bg-[#1c1b18] text-white text-xs font-semibold hover:bg-[#33312b] transition">
            원문 정보 보기 ↗
          </a>
        </div>
      `;
      hydrateImages(body);
      modal.classList.remove('hidden');
    }

    function attachCardListeners(root) {
      hydrateImages(root);
      root.querySelectorAll('.save-toggle-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const item = findItemById(btn.dataset.saveId);
          if (item) toggleSave(item);
        });
      });
      root.querySelectorAll('.detail-open-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const item = findItemById(btn.dataset.detailId);
          if (item) openDetailModal(item);
        });
      });
    }

    function renderCurrentView() {
      if (state.activeTab === 'matcher') renderMatcherResults();
      else if (state.activeTab === 'archive') renderArchive();
      else if (state.activeTab === 'saved') renderSaved();
    }

    async function runSearch(dateStr) {
      if (!dateStr) return;
      state.selectedDate = dateStr;
      document.getElementById('birthDateInput').value = dateStr;
      addToHistory(dateStr);

      const local = matchLocal(dateStr);
      const useWd = true;

      state.lastResults = {
        ...local,
        wikidata: [],
        wikidataMd: [],
        wikidataStatus: useWd ? 'loading' : 'off'
      };

      const banner = document.getElementById('statusBanner');
      const statusText = document.getElementById('statusText');
      const statusBadge = document.getElementById('statusBadge');

      if (useWd) {
        banner.classList.remove('hidden');
        statusText.textContent = `${dateStr} 기준 Wikidata 전 세계 건축물 데이터를 조회하는 중...`;
        statusBadge.textContent = '조회 중';
        renderMatcherResults();

        const wdRes = await queryWikidata(dateStr);
        state.lastResults.wikidata = wdRes.items || [];
        state.lastResults.wikidataMd = wdRes.mdItems || [];
        state.lastResults.wikidataStatus = wdRes.status;

        if (wdRes.status === 'ok') {
          const totalWd = (wdRes.items?.length || 0) + (wdRes.mdItems?.length || 0);
          statusText.textContent = `내장 아카이브와 Wikidata 조회를 완료했습니다. (Wikidata ${totalWd}건)`;
          statusBadge.textContent = '실시간 연동';
        } else {
          statusText.textContent = 'Wikidata 실시간 조회에 연결하지 못해 내장 아카이브 결과만 표시합니다.';
          statusBadge.textContent = '오프라인 폴백';
        }
      } else {
        banner.classList.add('hidden');
      }

      renderMatcherResults();
    }

    // Event bindings
    document.querySelectorAll('.nav-tab').forEach((btn) => {
      btn.addEventListener('click', () => {
        const target = btn.dataset.tab;
        state.activeTab = target;
        document.querySelectorAll('.nav-tab').forEach((b) => {
          b.classList.toggle('tab-active', b.dataset.tab === target);
          b.classList.toggle('bg-[#f0ede6]', b.dataset.tab !== target);
          b.classList.toggle('text-[#1c1b18]', b.dataset.tab !== target);
        });
        document.getElementById('view-matcher').classList.toggle('hidden', target !== 'matcher');
        document.getElementById('view-archive').classList.toggle('hidden', target !== 'archive');
        document.getElementById('view-saved').classList.toggle('hidden', target !== 'saved');
        renderCurrentView();
      });
    });

    document.getElementById('birthForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const val = document.getElementById('birthDateInput').value;
      if (val) runSearch(val);
    });

    document.getElementById('randomDateBtn').addEventListener('click', () => {
      const pick = CURATED_BUILDINGS[Math.floor(Math.random() * CURATED_BUILDINGS.length)];
      runSearch(pick.date);
    });

    document.getElementById('archiveSearchInput').addEventListener('input', (e) => {
      state.archiveQuery = e.target.value;
      renderArchive();
    });

    document.querySelectorAll('.region-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        state.regionFilter = btn.dataset.region;
        document.querySelectorAll('.region-btn').forEach((b) => {
          b.classList.toggle('tab-active', b.dataset.region === state.regionFilter);
          b.classList.toggle('bg-[#f0ede6]', b.dataset.region !== state.regionFilter);
          b.classList.toggle('text-[#1c1b18]', b.dataset.region !== state.regionFilter);
        });
        renderArchive();
      });
    });

    document.getElementById('clearSavedBtn').addEventListener('click', () => {
      state.savedIds = [];
      persistSaved();
      updateBadges();
      renderSaved();
      showToast('저장 목록을 비웠습니다.');
    });

    document.getElementById('closeModalBtn').addEventListener('click', () => {
      document.getElementById('detailModal').classList.add('hidden');
    });

    document.getElementById('detailModal').addEventListener('click', (e) => {
      if (e.target.id === 'detailModal') {
        document.getElementById('detailModal').classList.add('hidden');
      }
    });

    // Init
    loadSaved();
    loadHistory();
    updateBadges();
    runSearch(state.selectedDate);
  </script>
</body>
</html>
